name: Gerar APK STV Instalador

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Aceitar licenças Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk STV-Instalador.apk
      - uses: actions/upload-artifact@v4
        with:
          name: STV-Instalador-apk
          path: STV-Instalador.apk
      - name: Publicar APK na Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          files: STV-Instalador.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
